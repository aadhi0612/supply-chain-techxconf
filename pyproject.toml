[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "siliconflow"
version = "0.1.0"
description = "Constraint-aware semiconductor supply allocation and recovery control plane"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "sqlalchemy>=2.0",
  "ortools>=9.10",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
siliconflow = "siliconflow.cli:main"

[tool.setuptools.packages.find]
include = ["siliconflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "E741", "B008", "B904", "B905"]
